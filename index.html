<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dooz game</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex justify-center items-center h-screen bg-gray-100 font-[Segoe_UI]">

  <div class="shadow-md p-5 bg-white">
    <div class="flex justify-between mb-5">
      <div class="text-lg" id="playerX">Player X: 0</div>
      <div class="text-lg" id="playerO">Player O: 0</div>
    </div>

    <div class="grid grid-cols-3 gap-1.5">
      <div class="w-24 h-24 flex justify-center items-center text-xl border border-blue-300 rounded-md cursor-pointer transition-colors duration-300 hover:bg-gray-200" data-cell></div>
      <div class="w-24 h-24 flex justify-center items-center text-xl border border-blue-300 rounded-md cursor-pointer transition-colors duration-300 hover:bg-gray-200" data-cell></div>
      <div class="w-24 h-24 flex justify-center items-center text-xl border border-blue-300 rounded-md cursor-pointer transition-colors duration-300 hover:bg-gray-200" data-cell></div>
      <div class="w-24 h-24 flex justify-center items-center text-xl border border-blue-300 rounded-md cursor-pointer transition-colors duration-300 hover:bg-gray-200" data-cell></div>
      <div class="w-24 h-24 flex justify-center items-center text-xl border border-blue-300 rounded-md cursor-pointer transition-colors duration-300 hover:bg-gray-200" data-cell></div>
      <div class="w-24 h-24 flex justify-center items-center text-xl border border-blue-300 rounded-md cursor-pointer transition-colors duration-300 hover:bg-gray-200" data-cell></div>
      <div class="w-24 h-24 flex justify-center items-center text-xl border border-blue-300 rounded-md cursor-pointer transition-colors duration-300 hover:bg-gray-200" data-cell></div>
      <div class="w-24 h-24 flex justify-center items-center text-xl border border-blue-300 rounded-md cursor-pointer transition-colors duration-300 hover:bg-gray-200" data-cell></div>
      <div class="w-24 h-24 flex justify-center items-center text-xl border border-blue-300 rounded-md cursor-pointer transition-colors duration-300 hover:bg-gray-200" data-cell></div>
    </div>

    <button id="restart" class="mt-5 px-2.5 py-2 text-lg cursor-pointer border border-gray-200 rounded-lg transition-colors duration-500 hover:text-white hover:bg-[#176B87]">
      Restart
    </button>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
